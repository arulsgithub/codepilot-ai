<div class="composer">
  <textarea
    #textareaRef
    class="composer-textarea"
    rows="1"
    placeholder="Ask CodePilot anything..."
    aria-label="Message CodePilot"
    [(ngModel)]="draft"
    (input)="onInput()"
    (keydown)="onKeydown($event)"
    [attr.disabled]="disabled ? '' : null"
  ></textarea>

  @if (streaming) {
    <button
      type="button"
      class="composer-send composer-stop"
      aria-label="Stop generating"
      (click)="stopRequested.emit()"
    >
      Stop
    </button>
  } @else {
    <button
      type="button"
      class="composer-send"
      [disabled]="!canSend"
      aria-label="Send message"
      (click)="submit()"
    >
      Send
    </button>
  }
</div>
