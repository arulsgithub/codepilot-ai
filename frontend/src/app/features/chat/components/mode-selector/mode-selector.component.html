<div
  class="mode-selector"
  role="radiogroup"
  aria-label="Model mode"
  [class.mode-selector--disabled]="disabled"
>
  @for (option of options; track option.value) {
    <button
      type="button"
      class="mode-option"
      role="radio"
      [class.mode-option--active]="option.value === mode"
      [attr.aria-checked]="option.value === mode"
      [attr.title]="option.hint"
      [disabled]="disabled"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
