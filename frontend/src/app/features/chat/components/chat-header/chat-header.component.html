<header class="header">
  <div class="header-left">
    <button
      type="button"
      class="menu-button"
      aria-label="Toggle conversation sidebar"
      (click)="menuToggled.emit()"
    >
      <span class="menu-icon" aria-hidden="true">☰</span>
    </button>
    <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
    <span class="brand-name">CodePilot AI</span>
  </div>

  <div class="header-right">
    <button
      type="button"
      class="repo-attach"
      title="Command palette (Ctrl/⌘+K)"
      (click)="commandPaletteRequested.emit()"
    >
      <span aria-hidden="true">⌘K</span>
    </button>
    <button
      type="button"
      class="repo-attach edit-code-button"
      title="Describe a code change for CodePilot to plan and apply"
      (click)="editPanelRequested.emit()"
    >
      <span class="repo-icon" aria-hidden="true">✎</span> Edit code
    </button>

    @if (repositoryRoot) {
      <span class="repo-chip" [class.repo-chip--indexing]="isIndexing">
        <button
          type="button"
          class="repo-chip-open"
          [attr.title]="repositoryRoot"
          (click)="repositoryPanelRequested.emit()"
        >
          <span class="repo-icon" aria-hidden="true">▣</span>
          <span class="repo-name">{{ repositoryName }}</span>
          @if (isIndexing) {
            <span class="repo-indexing-dot" aria-hidden="true"></span>
            <span class="repo-indexing-text">indexing…</span>
          }
        </button>
        <button
          type="button"
          class="repo-chip-detach"
          aria-label="Detach repository"
          (click)="repositoryDetached.emit()"
        >
          ✕
        </button>
      </span>
    } @else {
      <button
        type="button"
        class="repo-attach"
        (click)="repositoryPanelRequested.emit()"
      >
        <span class="repo-icon" aria-hidden="true">▣</span> Attach repo
      </button>
    }

    <span class="badge">Nemotron</span>
    <span class="badge badge--muted">Phase 2</span>
    <button
      type="button"
      class="theme-toggle"
      [attr.aria-label]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="themeToggled.emit()"
    >
      @if (theme === 'dark') {
        <span aria-hidden="true">☀</span>
      } @else {
        <span aria-hidden="true">☾</span>
      }
    </button>
  </div>
</header>
