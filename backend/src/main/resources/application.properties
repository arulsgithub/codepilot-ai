spring.application.name=codepilot-backend

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===============================
# NVIDIA Nemotron
# ===============================
nemotron.base-url=${NEMOTRON_BASE_URL}
nemotron.api-key=${NEMOTRON_API_KEY}
nemotron.model=${NEMOTRON_MODEL}

#ai.embedding.provider=nemotron
#ai.embedding.api-key=${NEMOTRON_API_KEY}
#ai.embedding.base-url=${NEMOTRON_BASE_URL}
#ai.embedding.model=${NEMOTRON_MODEL}

#ai.embedding.provider=gemini
#ai.embedding.api-key=${GEMINI_API_KEY}

# ===============================
# Multi-model routing
# ===============================
ai.providers.nemotron.base-url=${NEMOTRON_BASE_URL}
ai.providers.nemotron.api-key=${NEMOTRON_API_KEY}
ai.providers.groq.base-url=https://api.groq.com/openai/v1
ai.providers.openrouter.base-url=https://openrouter.ai/api/v1

ai.models.fast=groq:openai/gpt-oss-20b
ai.models.code=groq:openai/gpt-oss-120b
ai.models.rag=groq:openai/gpt-oss-120b
ai.models.reasoning=groq:openai/gpt-oss-120b
ai.models.title=groq:openai/gpt-oss-20b

ai.providers.groq.api-key=${GROQ_API_KEY:}
ai.providers.openrouter.api-key=${OPENROUTER_API_KEY:}

# ===============================
# Embeddings - local via Ollama (no key, no quota)
# ===============================
#ai.embedding.provider=ollama
#ai.embedding.base-url=http://localhost:11434
#ai.embedding.model=mxbai-embed-large

#ai.embedding.provider=gemini
#ai.embedding.api-key=${GEMINI_API_KEY:}

# ---- Git / GitHub integration ----
# Where cloned repositories land. Relative to the backend working directory.
codepilot.git.workspace-root=./codepilot-workspace
# Blank = anonymous, which is fine for public repositories.
codepilot.git.token=${GITHUB_TOKEN:}
# 0 = full history. Set to e.g. 50 if you only care about current code.
codepilot.git.clone-depth=0

codepilot.git.api-base-url=https://api.github.com
codepilot.git.author-name=CodePilot AI
codepilot.git.author-email=codepilot@localhost
codepilot.git.branch-prefix=codepilot/

# ---- Embeddings ----
# voyage = hosted, code-tuned, works when deployed (200M free tokens)
# ollama = local only; cannot be reached from a hosted backend
#ai.embedding.provider=voyage
#ai.embedding.base-url=https://api.voyageai.com/v1
#ai.embedding.model=voyage-code-4
#ai.embedding.api-key=${VOYAGE_API_KEY:}

# ---- Embeddings ----
# Switch provider here. ?? ANY change requires a full re-index:
#   TRUNCATE code_chunks;  then re-index every repository.
# Vectors from different models are not comparable; Postgres accepts them
# without error and similarity search silently returns noise.
ai.embedding.provider=jina

# --- jina: free key, no card. 100 RPM / 100K TPM. ~1M free tokens (~14 re-indexes).
ai.embedding.base-url=https://api.jina.ai/v1
ai.embedding.model=jina-code-embeddings-1.5b
ai.embedding.api-key=${JINA_API_KEY:}
ai.embedding.batch-size=32
ai.embedding.pacing-millis=1000

# --- voyage (no card): 3 RPM / 10K TPM. 200M free tokens. Slow but huge allowance.
#     With a card on file: 2000 RPM / 3M TPM, free tokens unchanged - use batch-size=128, pacing=0.
# ai.embedding.provider=voyage
# ai.embedding.base-url=https://api.voyageai.com/v1
# ai.embedding.model=voyage-code-4
# ai.embedding.api-key=${VOYAGE_API_KEY:}
# ai.embedding.batch-size=24
# ai.embedding.pacing-millis=21000

# --- ollama: local only, unlimited, cannot be reached from a hosted backend.
# ai.embedding.provider=ollama
# ai.embedding.base-url=http://localhost:11434
# ai.embedding.model=mxbai-embed-large
# ai.embedding.batch-size=64
# ai.embedding.pacing-millis=0

# ---- Retrieval sizing ----
# Ask the database for more candidates than we use, so the budget can pick the best
# combination that fits rather than being stuck with the first N rows.
ai.retrieval.candidate-pool-size=15
ai.retrieval.max-chunks=5

# Character budget, not chunk count: a 3-line getter and a 114-line class are not the
# same amount of prompt. ~4 chars per token for code, so 8000 chars is ~2000 tokens.
# Raise once off a free tier; lower if Groq keeps returning 429.
ai.retrieval.max-context-chars=8000
ai.retrieval.max-edit-context-chars=16000


# ---- Authentication ----
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
# repo scope = read AND write on repositories, which is what cloning private repos and
# opening pull requests needs. read:user is for the profile shown in the UI.
spring.security.oauth2.client.registration.github.scope=repo,read:user

# Where to land after a successful login. Same origin, so just the app root.

# 32 bytes, base64. Changing this makes every stored GitHub token unreadable.
codepilot.security.token-key=${TOKEN_ENCRYPTION_KEY:}

# Local development only. MUST be false on any public deployment - both of these
# let a caller name an arbitrary server filesystem path.
codepilot.security.allow-local-repositories=true
codepilot.security.allow-raw-repository-paths=true

spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:4200/login/oauth2/code/github
codepilot.frontend-url=http://localhost:4200/